patch:
  style/horizontal: true
  style/color_scheme: wechat
  style/layout/candidate_spacing: 7
  style/layout/round_corner: 5
  preset_color_schemes:
     wechat:
       name: '微信键盘 / WeChat-keyboard' # 配色取自微信键盘
       author: zsakvo
       back_color: 0xFFFFFF
       border_height: 0
       border_width: 8
       candidate_format: '%c %@ '
       comment_text_color: 0x999999
       corner_radius: 5
       hilited_corner_radius: 5
       font_face: PingFangSC
       font_point: 16
       hilited_candidate_back_color: 0x75B100
       hilited_candidate_text_color: 0xFFFFFF
       horizontal: true
       inline_preedit: true
       label_font_point: 12
       text_color: 0x424242
       border_color: 0xFFFFFF
         
  "app_options/code.exe":
    ascii_mode: true
  "app_options/devenv.exe":
    ascii_mode: true
  "app_options/windowsterminal.exe":
    ascii_mode: true
